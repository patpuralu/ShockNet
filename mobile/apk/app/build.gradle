plugins {
    id 'com.android.application'
}

android {
    namespace 'net.shocknet.agent'
    compileSdk 33

    defaultConfig {
        applicationId "net.shocknet.agent"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
        resConfigs "es", "en"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.core:core:1.10.1'
}
